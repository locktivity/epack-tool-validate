# Release workflow for epack-tool-validate
# Triggers on version tags (v*) and builds with SLSA Level 3 provenance

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version (e.g., 0.1.6)"
        required: true
        type: string
      container_only:
        description: "Only publish the container (skip tests, binaries, release)"
        required: true
        type: boolean
        default: true

permissions: read-all

jobs:
  # Run tests and conformance checks before building
  test:
    if: ${{ !inputs.container_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: go build -o epack-tool-validate .

      - name: Run conformance tests
        run: |
          EPACK_VERSION="$(go list -m -f '{{.Version}}' github.com/locktivity/epack)"
          echo "Installing epack-conformance at ${EPACK_VERSION}"
          go install -tags conformance github.com/locktivity/epack/cmd/epack-conformance@"${EPACK_VERSION}"
          epack-conformance tool ./epack-tool-validate --level standard

  # Compute build arguments (version)
  args:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ldflags.outputs.version }}
      tag: ${{ steps.ldflags.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: ldflags
        run: |
          if [ "${{ inputs.version }}" != "" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  # Build binaries with SLSA Level 3 provenance
  build:
    if: ${{ !inputs.container_only }}
    needs: [test, args]
    permissions:
      id-token: write
      contents: write
      actions: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version-file: go.mod
      config-file: .slsa-goreleaser/epack-tool-validate-${{ matrix.os }}-${{ matrix.arch }}.yml
      evaluated-envs: "VERSION:${{ needs.args.outputs.version }}"

  # Create GitHub Release with all artifacts
  release:
    if: ${{ !inputs.container_only }}
    needs: [args, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Find and move all binaries and attestations
          find artifacts -type f \( -name "epack-tool-validate-*" -o -name "*.intoto.jsonl" \) -exec mv {} release/ \;
          # Rename .intoto.jsonl to .sigstore.json (epack expects this extension)
          cd release
          for f in *.intoto.jsonl; do
            [ -f "$f" ] && mv "$f" "${f%.intoto.jsonl}.sigstore.json"
          done
          # Create checksums
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the container image to GHCR.
  #
  # The binaries come from the release rather than a fresh build, so the image
  # carries the same bytes the checksums and SLSA provenance describe. A
  # consumer pinning this image and a consumer verifying the release checksum
  # are then talking about one artifact.
  container:
    needs: [args, release]
    if: ${{ always() && needs.args.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download binaries
        run: |
          mkdir -p binaries
          for arch in amd64 arm64; do
            curl -sfL "https://github.com/${{ github.repository }}/releases/download/${{ needs.args.outputs.tag }}/epack-tool-validate-linux-${arch}" \
              -o "binaries/epack-tool-validate-linux-${arch}"
            chmod +x "binaries/epack-tool-validate-linux-${arch}"
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/container/epack-tool-validate.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/epack-tool-validate:${{ needs.args.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/epack-tool-validate:latest
